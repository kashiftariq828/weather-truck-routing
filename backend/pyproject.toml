[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "SIM",            # core correctness and style
  "C4", "PIE", "RET", "RUF", "ARG", "DTZ",   # simpler comprehensions/returns, no unused args, tz-aware datetimes
  "N", "PT", "T20", "ERA", "PL",             # naming, pytest style, no print/commented-out code, pylint checks
]
ignore = [
  "PLR2004",  # the risk thresholds are the spec's numbers; naming each one would hide them
]

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]  # Django's standard entry point imports lazily on purpose
